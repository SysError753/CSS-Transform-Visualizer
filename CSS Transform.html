<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions Visuals</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="box">
            <div class="blue scaleX">scaleX</div>
        </div>
        <div class="box">
            <div class="blue scaleY">scaleY</div>
        </div>
        <div class="box">
            <div class="blue scale">scale</div>
        </div>
        <div class="box">
            <div class="blue rotateX">rotateX</div>
        </div>
        <div class="box">
            <div class="blue rotateY">rotateY</div>
        </div>
        <div class="box">
            <div class="blue rotateZ">rotateZ</div>
        </div>
        <div class="box">
            <div class="blue rotate">rotate</div>
        </div>
        <div class="box">
            <div class="blue translateX">translateX</div>
        </div>
        <div class="box">
            <div class="blue translateY">translateY</div>
        </div>
        <div class="box">
            <div class="blue translate">translate</div>
        </div>
        <div class="box">
            <div class="blue skewX">skewX</div>
        </div>
        <div class="box">
            <div class="blue skewY">skewY</div>
        </div>
    </div>
</body>

</html>
